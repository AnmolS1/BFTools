name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82.0"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Upload binaries (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-x86_64
          path: |
            target/release/bf-lsp
            target/release/bf-dap
            target/release/bf-interpreter
            target/release/bf-testrunner
            target/release/bf-precompiler

      - name: Upload binaries (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: |
            target/release/bf-lsp
            target/release/bf-dap
            target/release/bf-interpreter
            target/release/bf-testrunner
            target/release/bf-precompiler

      - name: Upload binaries (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x86_64
          path: |
            target/release/bf-lsp.exe
            target/release/bf-dap.exe
            target/release/bf-interpreter.exe
            target/release/bf-testrunner.exe
            target/release/bf-precompiler.exe
