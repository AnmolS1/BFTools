name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: binaries-linux-x86_64
            bundled_artifact: bundled-binaries-linux-x86_64
            platform: linux-x86_64
            suffix: ""
          - os: macos-latest
            artifact_name: binaries-macos
            bundled_artifact: bundled-binaries-macos-arm64
            platform: macos-arm64
            suffix: ""
          - os: windows-latest
            artifact_name: binaries-windows-x86_64
            bundled_artifact: bundled-binaries-windows-x86_64
            platform: windows-x86_64
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82.0"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Rename binaries with platform suffix
        shell: bash
        run: |
          cd target/release
          for bin in bf-lsp bf-dap bf-interpreter bf-testrunner bf-precompiler; do
            if [ -f "${bin}${{ matrix.suffix }}" ]; then
              cp "${bin}${{ matrix.suffix }}" "${bin}-${{ matrix.platform }}${{ matrix.suffix }}"
            fi
          done

      - name: Upload platform-suffixed binaries (for GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/bf-lsp-${{ matrix.platform }}${{ matrix.suffix }}
            target/release/bf-dap-${{ matrix.platform }}${{ matrix.suffix }}
            target/release/bf-interpreter-${{ matrix.platform }}${{ matrix.suffix }}
            target/release/bf-testrunner-${{ matrix.platform }}${{ matrix.suffix }}
            target/release/bf-precompiler-${{ matrix.platform }}${{ matrix.suffix }}

      - name: Upload original binaries (for VSIX bundling)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundled_artifact }}
          path: |
            target/release/bf-lsp${{ matrix.suffix }}
            target/release/bf-dap${{ matrix.suffix }}
            target/release/bf-interpreter${{ matrix.suffix }}
            target/release/bf-testrunner${{ matrix.suffix }}
            target/release/bf-precompiler${{ matrix.suffix }}

  package-extension:
    name: Package VSIX (${{ matrix.vscode_target }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - vscode_target: linux-x64
            binary_artifact: bundled-binaries-linux-x86_64
            suffix: ""
          - vscode_target: darwin-arm64
            binary_artifact: bundled-binaries-macos-arm64
            suffix: ""
          - vscode_target: win32-x64
            binary_artifact: bundled-binaries-windows-x86_64
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Compile TypeScript
        run: npm run compile

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary_artifact }}
          path: bin

      - name: Make binaries executable
        if: matrix.suffix == ''
        run: chmod +x bin/*

      - name: Package platform-specific VSIX
        run: npx vsce package --target ${{ matrix.vscode_target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode_target }}
          path: "*.vsix"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, package-extension]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/binaries-linux-x86_64/*
            artifacts/binaries-macos/*
            artifacts/binaries-windows-x86_64/*
            artifacts/vsix-linux-x64/*.vsix
            artifacts/vsix-darwin-arm64/*.vsix
            artifacts/vsix-win32-x64/*.vsix
          generate_release_notes: true

  publish-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: package-extension

    steps:
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to Marketplace
        run: vsce publish --packagePath vsix/*.vsix -p ${{ secrets.VSCE_PAT }}
